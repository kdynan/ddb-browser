name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit, API and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      # Use the service container instead of downloading DynamoDB Local.
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit and API tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  desktop:
    name: Desktop app smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure the Electron binary is downloaded
        run: node node_modules/electron/install.js
      - name: Desktop tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-report
          path: |
            playwright-report-desktop
            test-results
          retention-days: 7
